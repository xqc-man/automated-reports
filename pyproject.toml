[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "automated-reports"
version = "0.1.0"
description = "可追溯的自动化报表数据处理工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2,<3", "duckdb>=1.2,<2"]

[project.scripts]
automated-reports = "automated_reports.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".uv-cache", ".venv", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
