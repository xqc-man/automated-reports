name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.3"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Check fixture command-line flow
        run: |
          uv run automated-reports build --input tests/fixtures/input.csv --manifest tests/fixtures/source.json
          uv run automated-reports validate
          uv run automated-reports query --metric sales_yoy
